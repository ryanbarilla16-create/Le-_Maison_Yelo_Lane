<!-- Category-First Large Cards Grid Component -->
<div id="categories-grid-view" class="h-100 flex-column overflow-y-auto pe-1" style="display: flex; scrollbar-width: thin; scrollbar-color: rgba(139, 99, 75, 0.2) transparent;">

    <!-- Categories Grid Container -->
    <div id="categories-container"
        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; align-items: stretch; padding-bottom: 2rem;">
        {% for cat_name, info in categories_data.items() %}
        <div class="card border-0 shadow-sm category-card d-flex flex-column h-100 rounded-4 overflow-hidden position-relative"
            style="cursor: pointer; transition: all 0.3s ease; background: #ffffff; border: 1px solid rgba(139, 99, 75, 0.12) !important;"
            onclick="showCategoryItems('{{ cat_name|replace("'", "\\'") }}')">
            
            <!-- Category Image -->
            <div style="height: 140px; overflow: hidden; position: relative; background: #FAF6F0; flex-shrink: 0;">
                {% if info.image %}
                <img loading="lazy" decoding="async" src="{{ info.image }}" class="w-100 h-100 category-img"
                    style="object-fit: cover; transition: transform 0.5s ease;" alt="{{ cat_name }}"
                    onerror="this.style.display='none';this.parentNode.innerHTML='<div class=\'w-100 h-100 d-flex align-items-center justify-content-center\'><i class=\'fas fa-utensils fa-2x\' style=\'color:rgba(139,99,75,0.2);\'></i></div>'">
                {% else %}
                <div class="w-100 h-100 d-flex align-items-center justify-content-center">
                    <i class="fas fa-utensils fa-2x" style="color: rgba(139, 99, 75, 0.2);"></i>
                </div>
                {% endif %}
            </div>

            <!-- Card Content -->
            <div class="card-body p-3 d-flex flex-column flex-grow-1 justify-content-between" style="background: #ffffff;">
                <h6 class="card-title fw-bold m-0 text-truncate" style="color: #5D4037; font-size: 0.95rem;">{{ cat_name }}</h6>
                <p class="mb-0 mt-3 fw-bold d-flex align-items-center justify-content-between" style="font-size: 0.8rem; color: #8B634B;">
                    <span>See More</span>
                    <i class="fas fa-arrow-right"></i>
                </p>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Search Results View (Initially Hidden) -->
    <div id="search-results-view" style="display: none;" class="pb-4">
        <div class="mb-3 d-flex justify-content-between align-items-center">
            <button type="button" onclick="clearSearch()" class="btn rounded-pill border shadow-sm px-3 py-1 fw-bold back-btn"
                style="color: #5D4037; background: #ffffff; font-size: 0.85rem; border-color: rgba(139,99,75,0.2) !important;">
                <i class="fas fa-times me-1"></i> Clear Search
            </button>
            <h6 class="mb-0 fw-bold" style="color: #8B634B;">Search Results</h6>
        </div>
        <div id="search-items-container"
            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.2rem; align-items: stretch;">
        </div>
    </div>
</div>
