<!-- POS Order Ticket / Cart Panel (~35% Width Panel) -->
<div class="pos-cart-panel h-100 d-flex flex-column rounded-4 bg-white shadow-sm overflow-hidden"
    style="border: 1px solid rgba(139, 99, 75, 0.12);">

    <form action="{{ url_for('admin.walkin_order_submit') }}" method="POST" id="orderForm"
        onsubmit="return handleOrderSubmit(event)" class="h-100 d-flex flex-column">
        <input type="hidden" name="amount_tendered" id="hiddenAmountTendered">

        <!-- Top Header & Details Section -->
        <div class="pos-cart-header p-3 border-bottom" style="background: #FAF6F0;">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-receipt" style="color: #8B634B; font-size: 1.1rem;"></i>
                    <h5 class="fw-bold mb-0" style="color: #5D4037; font-size: 1.05rem;">Order Summary</h5>
                </div>
                <button type="button" onclick="clearCartItems()" class="btn btn-sm btn-link text-danger p-0 text-decoration-none fw-semibold" style="font-size: 0.78rem;">
                    <i class="fas fa-trash-alt me-1"></i> Clear All
                </button>
            </div>

            <!-- Seamless Dine-in vs Takeout Toggle -->
            <div class="pos-dining-toggle p-1 rounded-pill mb-2 d-flex align-items-center" style="background: #EFEBE4; border: 1px solid rgba(139, 99, 75, 0.15);">
                <input type="hidden" name="dining_option" id="diningOptionInput" value="DINE_IN">
                <button type="button" id="btnDineIn" onclick="setDiningOption('DINE_IN')"
                    class="btn btn-sm w-50 rounded-pill fw-bold py-1 transition-all shadow-sm"
                    style="background: #5D4037; color: #ffffff; font-size: 0.82rem;">
                    🍽️ Dine-In
                </button>
                <button type="button" id="btnTakeout" onclick="setDiningOption('TAKE_OUT')"
                    class="btn btn-sm w-50 rounded-pill fw-bold py-1 transition-all"
                    style="background: transparent; color: #5D4037; font-size: 0.82rem;">
                    🛍️ Takeout
                </button>
            </div>

            <!-- Details: Table Number & Customer Name -->
            <div class="row g-2">
                <div class="col-6">
                    <select name="table_number" id="tableSelect" onchange="handleTableSelect(this.value)" onfocus="fetchTableStatuses()" onclick="fetchTableStatuses()" class="form-select form-select-sm rounded-pill shadow-none" required
                        style="border: 1px solid rgba(139, 99, 75, 0.2); font-size: 0.82rem; background-color: #ffffff;">
                        <option value="">Select Table...</option>
                        {% for i in range(1, 18) %}
                        <option value="{{ i }}">Table {{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-6">
                    <input type="text" name="customer_name" id="customerNameInput" class="form-control form-control-sm rounded-pill shadow-none"
                        placeholder="Customer Name..."
                        style="border: 1px solid rgba(139, 99, 75, 0.2); font-size: 0.82rem; background-color: #ffffff;"
                        value="Walk-in Customer">
                </div>
            </div>

            <!-- Payment Method Radio (Internal default) -->
            <div class="d-none">
                <input type="radio" name="payment_method" value="COUNTER" id="payCounter" checked>
                <input type="radio" name="payment_method" value="ONLINE" id="payGcash">
            </div>
        </div>

        <!-- Middle Cart Items Container -->
        <div id="orderItems" class="pos-cart-body flex-grow-1 p-3 overflow-y-auto" style="scrollbar-width: thin; scrollbar-color: rgba(139, 99, 75, 0.2) transparent;">
            <!-- Empty State -->
            <div id="emptyCartState" class="h-100 d-flex flex-column align-items-center justify-content-center text-center p-4">
                <div class="rounded-circle d-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px; background: #FAF6F0;">
                    <i class="fas fa-shopping-basket fa-2x" style="color: rgba(139, 99, 75, 0.3);"></i>
                </div>
                <h6 class="fw-bold mb-1" style="color: #5D4037;">Order is empty</h6>
                <p class="text-muted small mb-0">Select category & items to add to order ticket.</p>
            </div>
        </div>

        <!-- Bottom Summary & Massive Proceed Button -->
        <div class="pos-cart-footer p-3 border-top bg-white mt-auto">
            <!-- Breakdown Calculations -->
            <div class="pos-summary-details mb-3 p-2 rounded-3" style="background: #FAF6F0; border: 1px solid rgba(139, 99, 75, 0.08);">
                <div class="d-flex justify-content-between align-items-center mb-1 fs-7">
                    <span class="text-muted">Subtotal</span>
                    <span class="fw-semibold text-dark" id="posSubtotal">₱0.00</span>
                </div>
                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                    <span class="fw-bold text-dark fs-6">Total Amount</span>
                    <span class="fw-bold fs-5" style="color: #2E7D32;" id="totalAmount">₱0.00</span>
                </div>
            </div>

            <!-- Massive Proceed to Payment Button -->
            {% if current_user.role|upper not in ['ADMIN', 'CASHIER', 'STAFF', 'KITCHEN'] %}
            <button type="button" class="btn w-100 rounded-pill fw-bold text-white py-3 shadow-sm" disabled
                style="background: #9E9E9E; cursor: not-allowed; font-size: 1.05rem;">
                <i class="fas fa-lock me-2"></i>View Only (Staff Required)
            </button>
            {% else %}
            <button type="submit" class="btn w-100 rounded-pill fw-bold text-white py-3 shadow-sm transition-all"
                id="submitBtn" disabled
                style="background: linear-gradient(135deg, #8B634B, #5D4037); font-size: 1.05rem; letter-spacing: 0.5px;">
                <i class="fas fa-arrow-circle-right me-2"></i>Proceed to Payment
            </button>
            {% endif %}
        </div>
    </form>
</div>
