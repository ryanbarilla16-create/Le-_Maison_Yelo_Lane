{# ── Sidebar live badge styles ────────────────────────── #}
<style>
    .nav-item { position: relative; display: flex; align-items: center; gap: 8px; }
    .sidebar-badge {
        margin-left: auto;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 10px;
        background: linear-gradient(135deg, #e65100, #ff8f00);
        color: #fff;
        font-size: 0.68rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        box-shadow: 0 2px 6px rgba(230,81,0,0.35);
        transition: transform 0.2s, opacity 0.3s;
        animation: badgePop 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes badgePop {
        from { transform: scale(0.5); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
    }
</style>

{# ── AJAX Polling Script ──────────────────────────────── #}
<script>
(function() {
    const API_URL = '{{ url_for("cashier_portal.cashier_api_dashboard") }}';

    function updateBadge(id, count) {
        const el = document.getElementById(id);
        if (!el) return;
        if (count > 0) {
            el.textContent = count > 99 ? '99+' : count;
            el.style.display = 'inline-flex';
            // re-trigger pop animation on value change
            el.classList.remove('badgePop');
            void el.offsetWidth;
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = '';
        } else {
            el.style.display = 'none';
        }
    }

    function fetchSidebarStats() {
        fetch(API_URL, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            if (!data || !data.success) return;
            const s = data.stats || {};
            updateBadge('sidebar-badge-orders', s.active_orders || 0);

        })
        .catch(() => {}); // silent fail — don't break the UI
    }

    // Initial fetch + poll every 15 s
    document.addEventListener('DOMContentLoaded', fetchSidebarStats);
    setInterval(fetchSidebarStats, 15000);
})();
</script>
