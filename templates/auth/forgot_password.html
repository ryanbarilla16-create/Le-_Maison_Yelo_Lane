{% extends "layouts/base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<style>
    .forgot-password-container {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.02);
    }
    
    .stepper {
        display: flex;
        justify-content: space-between;
        position: relative;
        margin-bottom: 3rem;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
    }
    
    .stepper::before {
        content: "";
        position: absolute;
        top: 20px;
        left: 0;
        right: 0;
        height: 2px;
        background: #eee;
        z-index: 1;
    }
    
    .step {
        position: relative;
        z-index: 2;
        text-align: center;
        flex: 1;
    }
    
    .step-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 10px;
        font-weight: bold;
        color: #999;
        transition: all 0.3s ease;
    }
    
    .step.active .step-icon {
        background: #8B634B;
        border-color: #8B634B;
        color: #fff;
        box-shadow: 0 4px 10px rgba(139, 99, 75, 0.3);
    }
    
    .step-label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #999;
    }
    
    .step.active .step-label {
        color: #8B634B;
    }
    
    .btn-premium {
        background: linear-gradient(135deg, #5D4037 0%, #795548 100%) !important;
        border: none !important;
        transition: all 0.3s ease !important;
        box-shadow: 0 4px 14px rgba(93, 64, 55, 0.25) !important;
    }
    
    .btn-premium:hover {
        transform: translateY(-2px) !important;
        background: linear-gradient(135deg, #3E2723 0%, #5D4037 100%) !important;
        box-shadow: 0 8px 20px rgba(93, 64, 55, 0.3) !important;
    }
    
    .form-control:focus {
        border-color: #8B634B !important;
        box-shadow: 0 0 0 4px rgba(139, 99, 75, 0.1) !important;
    }
</style>

<div class="forgot-password-container">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0" style="border-radius: 24px; padding: 1rem;">
                <div class="card-body p-5">
                    <!-- Stepper UI -->
                    <div class="stepper">
                        <div class="step active">
                            <div class="step-icon">1</div>
                            <div class="step-label">Email</div>
                        </div>
                        <div class="step">
                            <div class="step-icon">2</div>
                            <div class="step-label">OTP</div>
                        </div>
                        <div class="step">
                            <div class="step-icon">3</div>
                            <div class="step-label">New Pass</div>
                        </div>
                    </div>

                    <div class="text-center mb-5">
                        <div style="background: rgba(139, 99, 75, 0.08); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                            <i class="fas fa-lock fa-2x" style="color: #8B634B;"></i>
                        </div>
                        <h2 class="fw-bold" style="font-family: 'Playfair Display', serif; color: #5D4037; font-size: 2rem;">Forgot Password</h2>
                        <p class="text-muted mx-auto" style="max-width: 300px; font-size: 0.95rem;">Enter your email and we'll send you an OTP code to reset your password.</p>
                    </div>

                    <!-- Inline Error/Success Box -->
                    <div id="forgotPasswordAlert" class="alert-box" style="display: none; align-items: center; gap: 10px; border-radius: 12px; padding: 12px 16px; font-size: 0.9rem; margin-bottom: 20px; font-weight: 500; line-height: 1.4;">
                        <i class="fas" id="forgotPasswordAlertIcon"></i>
                        <span id="forgotPasswordAlertText"></span>
                    </div>

                    <form method="POST" action="{{ url_for('main.forgot_password') }}" id="forgotPasswordForm">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
                        <div class="form-group mb-4">
                            <label for="email" class="fw-bold text-dark small mb-2 ms-1">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control p-3 rounded-3" 
                                style="border: 1px solid #dee2e6; font-size: 1rem;" 
                                required placeholder="Enter your email address">
                        </div>

                        <button type="submit" id="submitBtn" class="btn w-100 rounded-pill py-3 fw-bold text-white btn-premium">
                            Send OTP Code
                        </button>
                    </form>

                    <div class="text-center mt-5">
                        <p class="text-muted small mb-0">
                            Remember your password? 
                            <a href="{{ url_for('main.login') }}" class="fw-bold text-decoration-none ms-1" style="color: #8B634B;">Back to Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .alert-box {
        animation: slideDown 0.3s ease-out;
    }
    .alert-box.danger {
        background: rgba(220, 53, 69, 0.08);
        border: 1px solid rgba(220, 53, 69, 0.25);
        color: #c62828;
    }
    .alert-box.success {
        background: rgba(40, 167, 69, 0.08);
        border: 1px solid rgba(40, 167, 69, 0.25);
        color: #2e7d32;
    }
    .alert-box.info {
        background: rgba(23, 162, 184, 0.08);
        border: 1px solid rgba(23, 162, 184, 0.25);
        color: #117a8b;
    }
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        15%       { transform: translateX(-8px); }
        30%       { transform: translateX(8px); }
        45%       { transform: translateX(-6px); }
        60%       { transform: translateX(6px); }
        75%       { transform: translateX(-3px); }
        90%       { transform: translateX(3px); }
    }
    .shake { animation: shake 0.5s ease-in-out; }
</style>

<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const form = this;
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('forgotPasswordAlert');
        const alertIcon = document.getElementById('forgotPasswordAlertIcon');
        const alertText = document.getElementById('forgotPasswordAlertText');

        // Reset state
        btn.disabled = true;
        const origBtnText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SENDING...';
        alertBox.style.display = 'none';
        alertBox.classList.remove('shake');

        fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alertBox.className = 'alert-box success';
                alertIcon.className = 'fas fa-check-circle';
                alertText.textContent = data.message || 'OTP Sent successfully!';
                alertBox.style.display = 'flex';
                btn.innerHTML = '<i class="fas fa-check"></i> SUCCESS';
                btn.style.background = 'linear-gradient(135deg, #2e7d32, #43a047)';

                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1500);
            } else {
                alertBox.className = 'alert-box danger';
                alertIcon.className = 'fas fa-exclamation-circle';
                alertText.textContent = data.message || 'An error occurred. Please try again.';
                alertBox.style.display = 'flex';
                
                // Shake alert
                void alertBox.offsetWidth; // trigger reflow
                alertBox.classList.add('shake');
                
                btn.disabled = false;
                btn.innerHTML = origBtnText;
            }
        })
        .catch(err => {
            console.error(err);
            alertBox.className = 'alert-box danger';
            alertIcon.className = 'fas fa-wifi';
            alertText.textContent = 'Connection error. Please try again.';
            alertBox.style.display = 'flex';
            
            btn.disabled = false;
            btn.innerHTML = origBtnText;
        });
    });
</script>
{% endblock %}
