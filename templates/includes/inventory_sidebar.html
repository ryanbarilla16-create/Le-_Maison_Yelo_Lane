<!-- ─── INVENTORY SIDEBAR LIVE BADGE POLLING ──────────── -->
<style>
  @keyframes invBadgePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.5); }
    50%       { box-shadow: 0 0 0 5px rgba(229,57,53,0); }
  }
</style>
<script>
(function () {
  const POLL_URL   = "{{ url_for('inventory_portal.inventory_api_alerts') }}";
  const INTERVAL   = 20000; // every 20 seconds

  const lowstockBadge = document.getElementById('inv-lowstock-badge');
  const pendingBadge  = document.getElementById('inv-pending-badge');

  function updateBadge(el, count) {
    if (!el) return;
    if (count > 0) {
      el.textContent = count > 99 ? '99+' : count;
      el.style.display = 'inline-block';
    } else {
      el.style.display = 'none';
    }
  }

  function pollAlerts() {
    fetch(POLL_URL, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function(res) {
      if (!res.ok) return;          // silently ignore auth errors
      return res.json();
    })
    .then(function(data) {
      if (!data || !data.success) return;
      updateBadge(lowstockBadge, data.count || 0);
      updateBadge(pendingBadge,  data.pending_stock_requests || 0);
    })
    .catch(function() { /* network error — ignore, retry next cycle */ });
  }

  // Run once on load, then on interval
  pollAlerts();
  setInterval(pollAlerts, INTERVAL);
})();
</script>
