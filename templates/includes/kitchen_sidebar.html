<!-- ─── KITCHEN SIDEBAR LIVE BADGE POLLING ──────────── -->
<style>
  @keyframes kitchBadgePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.5); }
    50%       { box-shadow: 0 0 0 5px rgba(229,57,53,0); }
  }
</style>
<script>
(function () {
  const POLL_URL  = "{{ url_for('kitchen_portal.kitchen_api_sidebar') }}";
  const INTERVAL  = 15000; // every 15 seconds

  const ordersBadge  = document.getElementById('kitch-orders-badge');
  const stkreqBadge  = document.getElementById('kitch-stkreq-badge');

  function updateBadge(el, count, color) {
    if (!el) return;
    if (count > 0) {
      el.textContent = count > 99 ? '99+' : count;
      if (color) el.style.background = color;
      el.style.display = 'inline-block';
    } else {
      el.style.display = 'none';
    }
  }

  function pollSidebar() {
    fetch(POLL_URL, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function(res) {
      if (!res.ok) return;   // silently ignore 401 / network issues
      return res.json();
    })
    .then(function(data) {
      if (!data || !data.success) return;
      // Order Board: show pending + preparing
      var activeOrders = (data.pending_orders || 0) + (data.preparing_orders || 0);
      updateBadge(ordersBadge, activeOrders, '#e53935');
      // Stock Requests: green badge when inventory has fulfilled our requests
      updateBadge(stkreqBadge, data.fulfilled_requests || 0, '#43a047');
    })
    .catch(function() { /* network error — ignore, retry next cycle */ });
  }

  // Run once on load, then on interval
  pollSidebar();
  setInterval(pollSidebar, INTERVAL);
})();
</script>
