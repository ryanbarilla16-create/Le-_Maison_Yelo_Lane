{% extends "layouts/base.html" %}

{% block title %}Menu Workspace — Le Maison Yelo Lane{% endblock %}

{% block content %}
<!-- Prefetch key assets -->
<link rel="prefetch" href="/menu" as="document">
<link rel="preload" href="https://images.unsplash.com/photo-1559925393-8be0ec4767c8?q=80&w=2071&auto=format&fit=crop" as="image" crossorigin>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');

    .dashWrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 1.5rem 3.5rem 1.5rem;
    }
</style>

<!-- 1. COMPACT HERO SECTION COMPONENT -->
{% include 'customer/components/hero_section.html' %}

<!-- 2. E-COMMERCE MENU WORKSPACE -->
<div class="dashWrap">
    <!-- CATEGORY NAVIGATION COMPONENT -->
    {% include 'customer/components/category_nav.html' %}

    <!-- PRODUCT GRID COMPONENT -->
    {% include 'customer/components/product_grid.html' %}
</div>

<!-- CLIENT-SIDE E-COMMERCE CONTROLLER -->
<script>
    let activeCategory = 'All';

    function selectCategory(categoryName, btnEl) {
        activeCategory = categoryName;
        
        // Toggle active visual state on category pills
        const pills = document.querySelectorAll('.catPillBtn');
        pills.forEach(p => p.classList.remove('active'));
        if (btnEl) {
            btnEl.classList.add('active');
        }

        filterMenuWorkspace();
    }

    function filterMenuWorkspace() {
        const navInput = document.getElementById('navSearchInput');
        const query = navInput ? navInput.value.toLowerCase().trim() : '';

        const cards = document.querySelectorAll('#productGridContainer .prodCard');
        let visibleCount = 0;

        cards.forEach(card => {
            const category = card.getAttribute('data-category') || '';
            const name = card.getAttribute('data-name') || '';
            const desc = card.getAttribute('data-desc') || '';

            const matchesCategory = (activeCategory === 'All' || category.toLowerCase() === activeCategory.toLowerCase());
            const matchesQuery = (!query || name.includes(query) || desc.includes(query) || category.toLowerCase().includes(query));

            if (matchesCategory && matchesQuery) {
                card.style.display = 'flex';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        // Update count status text
        const countText = document.getElementById('filteredCountText');
        if (countText) {
            if (activeCategory === 'All' && !query) {
                countText.textContent = `Displaying ${visibleCount} Items`;
            } else {
                countText.textContent = `Showing ${visibleCount} matching item${visibleCount !== 1 ? 's' : ''}`;
            }
        }

        // Toggle empty results state
        const noResults = document.getElementById('noResultsNotice');
        if (noResults) {
            noResults.style.display = (visibleCount === 0) ? 'block' : 'none';
        }
    }

    function resetMenuFilters() {
        const navInput = document.getElementById('navSearchInput');
        if (navInput) navInput.value = '';
        
        const firstPill = document.querySelector('.catPillBtn');
        if (firstPill) selectCategory('All', firstPill);
        else filterMenuWorkspace();
    }

    function addToCartQuick(itemId, itemName, itemPrice) {
        const formData = new FormData();
        formData.append('quantity', 1);

        fetch('/cart/add/' + itemId, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.ok ? response.json() : { status: 'success', cart_count: null })
        .then(data => {
            if (typeof showToast === 'function') {
                showToast('success', `${itemName} added to cart!`);
            }
            if (data && data.cart_count !== undefined && data.cart_count !== null) {
                if (typeof window.updateCartBadge === 'function') {
                    window.updateCartBadge(data.cart_count);
                }
            } else {
                updateNavbarCartBadge();
            }
        })
        .catch(err => {
            if (typeof showToast === 'function') {
                showToast('success', `${itemName} added to cart!`);
            }
            updateNavbarCartBadge();
        });
    }

    function updateNavbarCartBadge() {
        const firstBadge = document.querySelector('.cart-badge');
        let currentVal = parseInt(firstBadge ? firstBadge.textContent.trim() : '0') || 0;
        let newCount = currentVal + 1;
        if (typeof window.updateCartBadge === 'function') {
            window.updateCartBadge(newCount);
        }
    }

    // Expose filter handle for navbar input events
    window.filterMenuWorkspace = filterMenuWorkspace;

    document.addEventListener('DOMContentLoaded', function() {
        filterMenuWorkspace();
    });
</script>
{% endblock %}
