<!-- ═══ MODULAR COMPONENT: SLIDE-OUT CART DRAWER (ENTERPRISE GOLD STANDARD) ═══ -->
<style>
    /* Overlay Backdrop */
    .mini-cart-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 2000;
        display: none;
        opacity: 0;
        transition: opacity 0.35s ease;
    }

    .mini-cart-overlay.show {
        display: block;
        opacity: 1;
    }

    /* Slide-Out Drawer Panel */
    .mini-cart-drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: 420px;
        max-width: 95vw;
        height: 100vh;
        background: #FDFBF9;
        z-index: 2001;
        box-shadow: -12px 0 50px rgba(0, 0, 0, 0.25);
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        display: flex;
        flex-direction: column;
        border-left: 1px solid rgba(139, 99, 75, 0.12);
    }

    .mini-cart-drawer.open {
        transform: translateX(0);
    }

    /* Header & Sub-Header Toggles */
    .m-cart-header {
        padding: 1.25rem 1.75rem 0.8rem 1.75rem;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .m-cart-header h4 {
        font-family: 'Playfair Display', serif;
        font-weight: 800;
        color: #4E342E;
        margin: 0;
        font-size: 1.25rem;
        display: flex;
        align-items: center;
    }

    .m-cart-subhead {
        padding: 0 1.75rem 1rem 1.75rem;
        background: #ffffff;
        border-bottom: 1px solid rgba(139, 99, 75, 0.1);
    }

    /* Segmented Control / Toggle Switch */
    .order-toggle-wrap {
        background: #F4EFEA;
        border: 1px solid rgba(139, 99, 75, 0.12);
        padding: 4px;
        border-radius: 50px;
        display: flex;
        gap: 4px;
    }

    .order-toggle-btn {
        flex: 1;
        border: none;
        padding: 6px 12px;
        border-radius: 50px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .order-toggle-btn.active {
        background: linear-gradient(135deg, #5D4037 0%, #795548 100%);
        color: #ffffff !important;
        box-shadow: 0 2px 10px rgba(93, 64, 55, 0.25);
    }

    .order-toggle-btn.inactive {
        background: transparent;
        color: #795548 !important;
        box-shadow: none;
    }

    .order-location-row {
        font-size: 0.75rem;
        color: #795548;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 0.65rem;
    }

    /* Flexible Body Section */
    .m-cart-body {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
    }

    .m-cart-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem 1rem;
    }

    .m-cart-empty i {
        font-size: 3.2rem;
        color: rgba(139, 99, 75, 0.22);
        margin-bottom: 1.2rem;
    }

    /* Sticky Footer Section */
    .m-cart-footer {
        margin-top: auto;
        padding: 1.25rem 1.75rem;
        background: #ffffff;
        border-top: 1px solid rgba(139, 99, 75, 0.12);
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.04);
    }

    .m-cart-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.45rem;
        font-size: 0.85rem;
        color: #795548;
        font-weight: 600;
    }

    .m-cart-row.total-row {
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px dashed rgba(139, 99, 75, 0.15);
        margin-bottom: 1.2rem;
    }

    .m-cart-row.total-row span:first-child {
        font-weight: 700;
        color: #4E342E;
        font-size: 0.95rem;
    }

    .m-cart-row.total-row span:last-child {
        font-family: 'Playfair Display', serif;
        font-weight: 800;
        font-size: 1.45rem;
        color: #3E2723;
    }

    .btn-m-checkout {
        background: linear-gradient(135deg, #5D4037 0%, #795548 100%);
        color: #ffffff !important;
        border: none;
        padding: 0.88rem 1.5rem;
        border-radius: 50px;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        box-shadow: 0 6px 20px rgba(93, 64, 55, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        text-align: center;
        text-decoration: none !important;
    }

    .btn-m-checkout:hover:not(:disabled) {
        background: linear-gradient(135deg, #3E2723 0%, #5D4037 100%);
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(62, 39, 35, 0.4);
    }

    .btn-m-checkout:disabled,
    .btn-m-checkout.disabled {
        opacity: 0.45 !important;
        background: #8B634B !important;
        box-shadow: none !important;
        cursor: not-allowed !important;
        pointer-events: none !important;
    }

    /* Cart Item Styling */
    .m-cart-item {
        display: grid;
        grid-template-columns: 20px 56px 1fr auto;
        gap: 0.85rem;
        align-items: center;
        padding: 0.9rem 0;
        border-bottom: 1px dashed rgba(139, 99, 75, 0.12);
    }

    .m-cart-img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        object-fit: cover;
        border: 1px solid rgba(139, 99, 75, 0.1);
    }

    .m-cart-info h6 {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 0.95rem;
        color: #3E2723;
        margin: 0 0 0.2rem 0;
    }

    .m-cart-info p {
        font-size: 0.82rem;
        color: #8B634B;
        font-weight: 700;
        margin: 0 0 0.5rem 0;
    }

    .m-qty-ctrl {
        display: inline-flex;
        align-items: center;
        background: #F4EFEA;
        border-radius: 50px;
        padding: 2px 6px;
        border: 1px solid rgba(139, 99, 75, 0.12);
    }

    .m-qty-btn {
        background: transparent;
        border: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        color: #5D4037;
        font-size: 0.9rem;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .m-qty-btn:hover {
        background: rgba(139, 99, 75, 0.15);
    }

    .m-qty-input {
        width: 32px;
        text-align: center;
        border: none;
        background: transparent;
        font-size: 0.82rem;
        font-weight: 700;
        color: #3E2723;
    }
</style>

<!-- Backdrop Overlay -->
<div class="mini-cart-overlay" id="miniCartOverlay" onclick="closeMiniCart()"></div>

<!-- Slide-Out Cart Drawer Panel -->
<div class="mini-cart-drawer" id="miniCartDrawer">
    <!-- Header -->
    <div class="m-cart-header">
        <h4>
            <i class="fas fa-shopping-basket me-2" style="color: #8B634B;"></i> Your Order
            <span class="badge rounded-pill ms-2" id="drawerItemCountBadge" style="background: rgba(139, 99, 75, 0.12); color: #8B634B; font-size: 0.72rem; font-weight: 700; padding: 4px 10px;">0 items</span>
        </h4>
        <button type="button" class="btn-close" onclick="closeMiniCart()" aria-label="Close" style="box-shadow: none;"></button>
    </div>

    <!-- Sub-Header: Order Type Segmented Control & Location -->
    <div class="m-cart-subhead">
        <div class="order-toggle-wrap">
            <button type="button" class="order-toggle-btn active" id="btnOrderDelivery" onclick="setOrderType('delivery')">
                <i class="fas fa-motorcycle"></i> Delivery
            </button>
            <button type="button" class="order-toggle-btn inactive" id="btnOrderPickup" onclick="setOrderType('pickup')">
                <i class="fas fa-store"></i> Pick-up / Dine-In
            </button>
        </div>
        <div class="order-location-row">
            <i class="fas fa-map-marker-alt" style="color: #8B634B;"></i>
            <span id="orderLocationText">Delivery to: Your Saved Address</span>
        </div>
    </div>

    <!-- Flexible Body Section -->
    <div class="m-cart-body" id="miniCartBody">
        <!-- Items or Empty State load here via JS -->
        <div class="text-center p-5 my-auto">
            <div class="spinner-border spinner-border-sm" style="color: #8B634B;" role="status"></div>
            <p class="text-muted mt-2 mb-0" style="font-size: 0.82rem;">Loading your order...</p>
        </div>
    </div>

    <!-- Sticky Checkout Footer (ALWAYS VISIBLE) -->
    <div class="m-cart-footer" id="miniCartFooter">
        <div class="m-cart-row">
            <span>Subtotal</span>
            <span id="miniCartSubtotal">₱0.00</span>
        </div>
        <div class="m-cart-row">
            <span>Delivery Fee</span>
            <span id="miniCartDeliveryFee" style="color: #2E7D32;">FREE</span>
        </div>
        <div class="m-cart-row total-row">
            <span>Total Amount</span>
            <span id="miniCartTotal">₱0.00</span>
        </div>
        
        <a href="{{ url_for('main.view_cart') }}" id="miniCartCheckoutBtn" class="btn-m-checkout disabled" disabled>
            Proceed to Checkout <i class="fas fa-arrow-right ms-2"></i>
        </a>
    </div>
</div>
